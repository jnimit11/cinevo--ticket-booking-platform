services:
  postgres:
    image: postgres:17
    container_name: cinevo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinevo
      POSTGRES_USER: cinevo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cinevo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinevo_user -d cinevo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cinevo_pgdata: